# Publishes the BikriPro website to GitHub Pages on every push to main:
#   /       → landing page (site/)
#   /app/   → the BikriPro web app (frontend build)
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy website

on:
  push:
    branches: [main]
    paths: ['site/**', 'frontend/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Build web app
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r site/* _site/
          cp -r frontend/dist _site/app
          touch _site/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
