# Builds every BikriPro installer:
#   Windows .exe (NSIS) · macOS .dmg · Linux .deb · Android .apk · iOS .ipa (unsigned)
# Run manually (Actions → Build installers → Run workflow) or push a tag like v1.0.0
# to also publish a GitHub Release with all files attached.
name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            cmd: dist:win
          - os: macos-latest
            cmd: dist:mac
          - os: ubuntu-latest
            cmd: dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install desktop tooling
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Build installer
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # unsigned build; add signing secrets later
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run ${{ matrix.cmd }} -- --publish never
      - uses: actions/upload-artifact@v7
        with:
          name: bikripro-${{ matrix.os }}
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.deb
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - name: Build web + sync Capacitor
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run build
          npx cap sync android
      - name: Build APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          mkdir -p ../../dist-mobile
          cp app/build/outputs/apk/debug/app-debug.apk ../../dist-mobile/BikriPro-android.apk
      - uses: actions/upload-artifact@v7
        with:
          name: bikripro-android
          path: dist-mobile/*.apk

  ios:
    name: iOS IPA (unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Build web + sync Capacitor
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run build
          npx cap sync ios
      - name: Build unsigned IPA
        working-directory: frontend/ios/App
        run: |
          pod install
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload && cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          mkdir -p ../../../dist-mobile && zip -qr ../../../dist-mobile/BikriPro-ios-unsigned.ipa Payload
      - uses: actions/upload-artifact@v7
        with:
          name: bikripro-ios
          path: dist-mobile/*.ipa

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: out
      - uses: softprops/action-gh-release@v3
        with:
          files: out/**/*
