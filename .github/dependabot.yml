# Weekly dependency update PRs (grouped to keep the noise down)
version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule: { interval: weekly, day: saturday }
    open-pull-requests-limit: 5
    groups:
      backend-minor: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly, day: saturday }
    open-pull-requests-limit: 5
    groups:
      frontend-minor: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /desktop
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions: { patterns: ["*"] }
