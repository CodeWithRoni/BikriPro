# Render Blueprint — one HTTPS web service that runs the BikriPro API and also
# serves the web app. Database & image storage live in Supabase.
# Deploy: Render dashboard → New → Blueprint → pick this repo, then fill in the
# secret values it asks for (DATABASE_URL, SUPABASE_URL, SUPABASE_SECRET_KEY).
services:
  - type: web
    name: bikripro-api
    runtime: node
    region: singapore          # closest Render region to Bangladesh
    plan: free                 # free instances sleep after 15 min idle; use "starter" for always-on
    branch: main
    buildCommand: npm ci --prefix backend --omit=dev && npm ci --prefix frontend --include=dev && npm run build --prefix frontend
    startCommand: node backend/src/server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: TZ
        value: Asia/Dhaka
      - key: CORS_ORIGINS
        value: "*"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL          # Supabase → Connect → Session pooler URI (with password)
        sync: false
      - key: SUPABASE_URL          # Supabase → Settings → API → Project URL
        sync: false
      - key: SUPABASE_SECRET_KEY   # Supabase → Settings → API Keys → Secret key (sb_secret_…)
        sync: false
      - key: SUPABASE_BUCKET
        value: bikripro
      - key: SMS_PROVIDER
        value: log
